name: FC market scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # backup timer; GitHub often skips or delays these
  workflow_dispatch:               # also started every 15 min by the outside timer

concurrency: fc-scan               # never run two scans at once

permissions:
  contents: write                  # needed to save market_pc.db on the "data" branch

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      DB_FILE: market_pc.db
      DATA_BRANCH: ${{ github.ref_name == 'main' && 'data' || format('data-{0}', github.ref_name) }}   # other branches get their own DB branch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests curl_cffi

      # ── Restore price history from the "data" branch ─────────────────────
      # The DB is kept on a separate orphan branch so it never bloats main.
      # On the very first run the branch won't exist yet; that is fine.
      - name: Restore price history
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null 2>&1; then
            echo "Data branch found – fetching price history…"
            git fetch --depth=1 origin "$DATA_BRANCH"
            # The DB is stored gzip-compressed (about a third of the size); older runs stored it plain.
            if git show FETCH_HEAD:"$DB_FILE.gz" > "$DB_FILE.gz" 2>/dev/null && gzip -t "$DB_FILE.gz"; then
              gunzip -f "$DB_FILE.gz"
              echo "Restored $(du -h "$DB_FILE" | cut -f1) price history database (from .gz)."
            elif git show FETCH_HEAD:"$DB_FILE" > "$DB_FILE" 2>/dev/null; then
              rm -f "$DB_FILE.gz"
              echo "Restored $(du -h "$DB_FILE" | cut -f1) price history database (plain)."
            else
              rm -f "$DB_FILE" "$DB_FILE.gz"
              echo "Branch exists but DB file not found – starting fresh."
            fi
          else
            echo "No data branch yet – first run, starting with empty database."
          fi

      # ── Run the scan ──────────────────────────────────────────────────────
      - name: Run scan
        id: scan
        run: python fc_market_scanner.py --once
        env:
          FC_PLATFORM: pc
          FC_RUNS: "24"                # scans per launch, 30 s apart (~12 min of the 15 min cycle)
          FC_RUN_GAP: "30"             # seconds between scans (min 30); unchanged feeds are skipped
          FC_NOTIFY_EACH_RUN: "1"      # set to "0" to stop the per-run Discord line
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FC_MAX_LINES: "16"           # max cards per section (0 = unlimited)
          FC_MIN_PRICE: "15k"          # min card price of interest (e.g. 15k, 50k, 100k)
          FC_MAX_PRICE: "2M"             # max card price of interest (e.g. 1M, 2.5M, or empty for no max)

      # ── Save price history back to the "data" branch ──────────────────────
      # Runs even if the scan step fails so no history snapshots are lost.
      # Each push replaces the single commit on the branch (--force) so the
      # repository size stays constant no matter how long the bot runs.
      - name: Save price history
        if: always()
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if [ ! -f "$DB_FILE" ]; then
            echo "No DB file to save (scan never wrote one) – skipping."
            exit 0
          fi
          echo "Saving $(du -h "$DB_FILE" | cut -f1) price history database…"
          OUT=$(mktemp -d)
          gzip -6 -c "$DB_FILE" > "$OUT/$DB_FILE.gz"
          gzip -t "$OUT/$DB_FILE.gz" || { echo "Compression check failed – not saving."; exit 1; }
          echo "Compressed to $(du -h "$OUT/$DB_FILE.gz" | cut -f1)."
          cd "$OUT"
          git init -q -b "$DATA_BRANCH"
          git config user.name "fc-scanner"
          git config user.email "fc-scanner@users.noreply.github.com"
          [ -f "$GITHUB_WORKSPACE/bid_sheet.json" ] && cp "$GITHUB_WORKSPACE/bid_sheet.json" .
          git add "$DB_FILE.gz"
          [ -f bid_sheet.json ] && git add bid_sheet.json
          git commit -q -m "price history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "$REPO_URL"
          git push -q --force origin "$DATA_BRANCH"
          echo "Price history saved to branch '$DATA_BRANCH'."
