name: Refresh card list

# Runs when bundle.json (made by userscript/fut_card_refresh.user.js) is committed to main.
# Rebuilds players.json and holo_ids.json, commits them to main, deletes bundle.json again,
# and posts the new cards to Discord.
on:
  push:
    branches: [main]
    paths: [bundle.json]
  workflow_dispatch:

concurrency: refresh-cards

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Unpack the bundle
        run: |
          test -f bundle.json || { echo "bundle.json not found in the repo root"; exit 1; }
          python apply_bundle.py bundle.json

      - name: Rebuild
        run: python setup.py 2>&1 | tee setup_output.txt

      - name: Check and report
        id: report
        continue-on-error: true
        run: python report_refresh.py setup_output.txt
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit to main
        if: always() && hashFiles('bundle.json') != ''
        run: |
          git config user.name "fc-scanner"
          git config user.email "fc-scanner@users.noreply.github.com"
          git rm -q --cached bundle.json                 # the bundle is not kept in the repo
          if [ "${{ steps.report.outcome }}" = "success" ]; then
            git add players.json holo_ids.json
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Refresh card list (bundle.json)"
            git pull --rebase --autostash -q origin main
            git push origin HEAD:main
          fi

      - name: Fail if the rebuild was refused
        if: steps.report.outcome != 'success'
        run: exit 1
